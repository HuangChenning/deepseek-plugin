<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">deepseek-plugin DSH plugin workspace</title>
  <desc id="desc">A local read-only flow from Browser to DSH Web to the local mes CLI and an implementation-plan list.</desc>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#59d5c6" />
    </marker>
  </defs>

  <rect width="1200" height="400" rx="28" fill="#10171c" />
  <path d="M 56 72 H 1144 M 56 352 H 1144" stroke="#2d4149" stroke-width="2" />
  <path d="M 56 72 V 352 M 604 72 V 352" stroke="#24363e" stroke-width="2" />

  <g id="title-block" transform="translate(56 72)">
    <text x="0" y="31" fill="#59d5c6" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="20" font-weight="700" letter-spacing="2">DSH PLUGIN WORKSPACE</text>
    <text x="0" y="107" fill="#edf7f5" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, PingFang SC, sans-serif" font-size="56" font-weight="700" letter-spacing="-1.5">deepseek-plugin</text>
    <text x="0" y="154" fill="#c7d6d9" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, PingFang SC, sans-serif" font-size="27" font-weight="600">Independently packaged DSH Web plugins.</text>
    <text x="0" y="193" fill="#9fb1b7" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, PingFang SC, sans-serif" font-size="22">First package: a read-only MES implementation-plan list.</text>
    <rect x="0" y="220" width="188" height="40" rx="20" fill="#17353a" stroke="#3b8f89" stroke-width="2" />
    <text x="22" y="247" fill="#9ee9df" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="20" font-weight="700">LOCAL FIRST</text>
  </g>

  <g id="verified-local-flow" transform="translate(620 72)">
    <text x="0" y="31" fill="#70a8ff" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="20" font-weight="700" letter-spacing="1.5">VERIFIED LOCAL FLOW</text>
    <path d="M 110 149 H 124 M 245 149 H 259 M 380 149 H 394" fill="none" stroke="#59d5c6" stroke-width="3" marker-end="url(#arrow)" />

    <g id="browser">
      <rect x="0" y="104" width="110" height="90" rx="12" fill="#18242b" stroke="#47626c" stroke-width="2" />
      <circle cx="55" cy="132" r="11" fill="#70a8ff" opacity=".9" />
      <text x="55" y="169" fill="#edf7f5" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, PingFang SC, sans-serif" font-size="20" font-weight="700" text-anchor="middle">Browser</text>
    </g>

    <g id="dsh-web" transform="translate(135 0)">
      <rect x="0" y="104" width="110" height="90" rx="12" fill="#18242b" stroke="#47626c" stroke-width="2" />
      <circle cx="55" cy="132" r="11" fill="#59d5c6" opacity=".9" />
      <text x="55" y="169" fill="#edf7f5" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, PingFang SC, sans-serif" font-size="20" font-weight="700" text-anchor="middle">DSH Web</text>
    </g>

    <g id="mes-cli" transform="translate(270 0)">
      <rect x="0" y="104" width="110" height="90" rx="12" fill="#18242b" stroke="#47626c" stroke-width="2" />
      <circle cx="55" cy="132" r="11" fill="#59d5c6" opacity=".9" />
      <text x="55" y="169" fill="#edf7f5" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, PingFang SC, sans-serif" font-size="20" font-weight="700" text-anchor="middle">mes CLI</text>
    </g>

    <g id="plan-list" transform="translate(405 0)">
      <rect x="0" y="104" width="110" height="90" rx="12" fill="#18242b" stroke="#47626c" stroke-width="2" />
      <circle cx="55" cy="132" r="11" fill="#70a8ff" opacity=".9" />
      <text x="55" y="169" fill="#edf7f5" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, PingFang SC, sans-serif" font-size="20" font-weight="700" text-anchor="middle">plan list</text>
    </g>

    <text x="0" y="260" fill="#9fb1b7" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, PingFang SC, sans-serif" font-size="20">Fixed query inputs · no shell · read-only boundary</text>
  </g>
</svg>
